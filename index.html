<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6c63ff" />
    <meta name="description" content="Um espaço acolhedor para reconhecer como você está se sentindo. Suas respostas ficam apenas nesta página." />
    <title>Sentimentum — como estou me sentindo?</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="pular-link" href="#app-content">Pular para o conteúdo</a>

    <div class="app">
      <header class="topo">
        <div class="marca" aria-hidden="true">♥</div>
        <div class="identidade">
          <p class="eyebrow">SENTIMENTUM</p>
          <h1>Um espaço para você</h1>
        </div>
        <div class="controles-topo" aria-label="Preferências desta página">
          <button id="theme-toggle" class="controle" type="button" aria-pressed="false" aria-label="Ativar tema escuro">
            <span aria-hidden="true">🌙</span><span class="texto-controle">Tema escuro</span>
          </button>
          <button id="voice-toggle" class="controle" type="button" aria-pressed="false" aria-label="Ativar leitura em voz alta">
            <span aria-hidden="true">🔊</span><span class="texto-controle">Leitura desligada</span>
          </button>
        </div>
      </header>

      <main id="app-content" class="conteudo" tabindex="-1" aria-label="Percurso de acolhimento"></main>
      <div id="anuncios" class="sr-only" aria-live="polite" aria-atomic="true"></div>

      <footer class="rodape">
        <p>Suas respostas ficam somente nesta página: não são enviadas nem salvas.</p>
        <p>A leitura em voz alta usa a síntese de voz do seu navegador ou dispositivo.</p>
      </footer>
    </div>
  </body>
</html>
